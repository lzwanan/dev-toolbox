services:
  dev-toolbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-toolbox
    ports:
      - "3000:80"
    restart: unless-stopped
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
